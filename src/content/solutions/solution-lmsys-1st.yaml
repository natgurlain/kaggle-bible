    value: 0.96898
    split: private-lb
    configuration: Final official private leaderboard entry for team "BlackPearl (no leak)", scored on the replacement private test data described by the host.
    fold_summary: null
    claim_id: final-result-01
  - metric_id: log-loss
    value: 0.876
    split: public-lb
    configuration: Author-reported public leaderboard for the merged five-fold Gemma2-9B LoRA, 8-bit GPTQ, with test-time augmentation; reported before the host replaced the private test data.
    fold_summary: null
    claim_id: cv-lb-01
validation:
  strategy: stratified-kfold
  details: Five folds over the Kaggle training rows from StratifiedKFold on the three-way label with random_state=2025; external 33k rows are added only to the training side, and response-swapped copies keep their source row's fold and are dropped from the dev side. No grouping by prompt is applied in the pinned data-preparation code. The author reports per-fold log loss for both teachers and the distilled student. Whether teacher probabilities used for distillation were produced out-of-fold for every training row is not established in the inspected text.
  source_ids:
    - source-lmsys-1st
    - source-lmsys-1st-code
