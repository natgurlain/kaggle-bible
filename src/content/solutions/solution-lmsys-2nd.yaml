  - kapenon
  - tascj (tascj0)
source_ids:
  - source-lmsys-2nd
  - source-lmsys-2nd-code
  - source-lmsys-leaderboard
rank:
  value: 2
  basis: official-final-private
  source_id: source-lmsys-leaderboard
scores:
  - metric_id: log-loss
    value: 0.97425
    split: private-lb
    configuration: Final official private leaderboard entry for team "[Rist] pref(no leak)", after the host announced replacing the private test data and rerunning submissions; the inspected sources do not directly confirm completion.
    fold_summary: null
    claim_id: final-result-01
  - metric_id: log-loss
    value: 0.876
    split: local-cv
    configuration: Author-reported stage-3 average ensemble of Gemma2-9B and ArmoRM-Llama3-8B on the 20% prompt-grouped validation split (reported as 0.876 to 0.877).
    fold_summary: Single 20% holdout; component models 0.884 and 0.890.
    claim_id: results-01
  - metric_id: log-loss
    value: 0.868
    split: public-lb
    configuration: Author-reported "old LB" for the final two-model ensemble with 2:1 weighting after training ArmoRM-Llama3-8B on all data, which the authors label "old LB", i.e. before the announced private-test replacement.
    fold_summary: null
    claim_id: results-01
validation:
  strategy: group-kfold
  details: StratifiedGroupKFold with five splits (random_state=0) on the three-way label, grouped by the prompt text; one fold, 20% of the Kaggle training rows, is held out as validation. External and pseudo-labelled rows are training-only in the described stages. Only a single held-out fold is reported, not a five-fold average.
  source_ids:
    - source-lmsys-2nd
    - source-lmsys-2nd-code
