claims:
  - id: approach-01
    statement: The authors describe relational-table aggregates, model-derived history features, and a diverse LightGBM, XGBoost, random-forest, and linear-model ensemble.
    kind: source-reported
    evidence:
      - source_id: source-home-credit-12th
        locator: Feature Engineer; Model Ensemble
        support_summary: The write-up describes relational aggregates and history features followed by an ensemble of the listed model families.
    supports_claim_refs: []
    reproduction_ids: []
    conditions: These are components reported for this team's Home Credit approach.
    limitations: Their individual contributions are not isolated by the inspected source.
  - id: rank-01
    statement: The official final leaderboard row 12 links the #12 solution write-up as its solution, and its displayed members include four of the write-up's authors.
    kind: source-reported
    evidence:
      - source_id: source-home-credit-leaderboard
        locator: Final standings; rank 12 row, member avatars and solution link
        support_summary: The rank-12 row shows avatars for Yifan Xie, cxlcc, Zhiqiang Zhong and YL plus two further members, and its solution link targets the #12 solution write-up.
      - source_id: source-home-credit-12th
        locator: Write-up title, placement label and author list
        support_summary: The write-up is labeled 12th place and lists the six authors.
    supports_claim_refs: []
    reproduction_ids: []
    conditions: This matches the write-up to the official final row as displayed on 2026-10-26.
    limitations: Two members are shown only as a count, so the full team roster is matched through the solution link rather than by name.
  - id: final-result-01
    statement: The official final leaderboard shows the rank-12 team at private AUC 0.80329 after 189 entries.
    kind: source-reported
    evidence:
      - source_id: source-home-credit-leaderboard
        locator: Final standings; rank 12 row
        support_summary: The completed leaderboard displays score 0.80329 and 189 entries for rank 12.
    supports_claim_refs: []
    reproduction_ids: []
    conditions: This is the team's final private leaderboard entry for the official AUC metric.
    limitations: It does not reproduce the pipeline or identify which ensemble produced the selected submission; entry count is not a compute measurement.
  - id: cv-result-01
    statement: The authors report a final local-CV AUC of about 0.8047 for the average of their blending and stacking results, and a "PB" of 0.803.
    kind: source-reported
    evidence:
      - source_id: source-home-credit-12th
        locator: Opening paragraph; Model Ensemble
        support_summary: The authors report 0.8047 for their final averaged result and state "PB 0.803" without expanding the abbreviation.
    supports_claim_refs: []
    reproduction_ids: []
    conditions: This is the reported local-CV result for the described final ensemble.
    limitations: Fold construction and seeds are not specified; "PB" is not defined, so the 0.803 value is not assigned to a public or private split here; the result was not reproduced.
  - id: feature-progression-01
    statement: The authors report local CV of about 0.798-0.799 from grouped statistical features, 0.800-0.801 after adding RNN/CNN and LightGBM history-model features, and 0.8021 for the best single model on all teammates' features.
    kind: source-reported
    evidence:
      - source_id: source-home-credit-12th
        locator: Feature Engineer (Statistical Features; Model Features); opening of Feature Engineer
        support_summary: The write-up gives the local-CV range after each feature stage and the best single-model CV.
    supports_claim_refs: []
    reproduction_ids: []
    conditions: These are stage-level team reports, not a controlled ablation.
    limitations: The split is unspecified and each stage bundles several feature changes.
  - id: history-model-01
    statement: The authors' LightGBM history features label every history-table loan from a defaulting applicant as positive, train per table, and aggregate the predicted probabilities by SK_ID_CURR; their RNN/CNN features predict next-loan default probability from each applicant's loan sequence.
    kind: source-reported
    evidence:
      - source_id: source-home-credit-12th
        locator: Feature Engineer; Model Features
        support_summary: The write-up describes target-labeled history-row models whose predictions are grouped by applicant, plus sequence neural networks.
    supports_claim_refs: []
    reproduction_ids: []
    conditions: These target-derived features were part of the reported final feature set.
    limitations: The write-up does not state how these features were made out-of-fold for training applicants.
  - id: ensemble-progression-01
    statement: "The authors report that dozens of LightGBM models on random half-subsets of about 2k+ features (best single subsample model CV about 0.8014) averaged to CV 0.8037 and blended with the best single model to 0.8040; multi-family stacking reached 0.8034 and 0.8046 after adding the blending OOFs."
    kind: source-reported
    evidence:
      - source_id: source-home-credit-12th
        locator: Model Ensemble; Blending; Stacking
        support_summary: The write-up lists the CV after each blending and stacking step.
    supports_claim_refs: []
    reproduction_ids: []
    conditions: These are author-reported local-CV values for this team's ensembles.
    limitations: Blending used random k-fold seeds and the fold design is unspecified, so increments of a few ten-thousandths are not shown to exceed split noise.
  - id: feature-selection-01
    statement: The topic author reports paying little attention to feature selection, dropping only null-importance features to speed training and relying on low feature fraction or bagging for redundant features.
    kind: source-reported
    evidence:
      - source_id: source-home-credit-12th
        locator: Comment thread; topic-author reply on feature selection
        support_summary: zr describes dropping null-importance features and relying on low feature_fraction or bagging.
    supports_claim_refs: []
    reproduction_ids: []
    conditions: This is a comment-reply description of the team's practice.
    limitations: No comparison with a feature-selected alternative is reported.
unsuccessful_attempts: []
transfer_limits:
  - The inspected account is one participant report; its features and ensemble do not establish a reliable validation or modeling recipe for another dataset.
  - Target-derived history-row models need applicant-level out-of-fold construction that the write-up does not document, so the technique cannot be copied safely from this account alone.
